{% if oob %}
<a id="limpar-filtros" href="/" class="limpar" hx-swap-oob="true"{% if not filters.active_count %} hidden{% endif %}>Limpar filtros ({{ filters.active_count }})</a>
<button type="button" id="botao-generos" class="seletor" popovertarget="menu-generos" hx-swap-oob="true">Gênero{% if filters.genres %} ({{ filters.genres|length }}){% endif %}</button>
{% endif %}
<p class="contador">{{ page.total_results|milhar }} {{ "série" if page.total_results == 1 else "séries" }}</p>
{% if page.items %}
  <div class="cartoes">
    {% include "_cartoes.html" %}
  </div>
{% else %}
  <p class="vazio">Nenhuma série encontrada com esses filtros.</p>
{% endif %}
