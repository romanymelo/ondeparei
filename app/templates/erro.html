{% extends "base.html" %}

{% block title %}{{ message }} · {{ APP_NAME }}{% endblock %}

{% block content %}
<section class="erro">
  <h1>{{ message }}</h1>
  {% if retry_url %}
    <a class="botao" href="{{ retry_url }}">Tentar novamente</a>
  {% endif %}
  <p><a href="/">Voltar ao catálogo</a></p>
</section>
{% endblock %}
